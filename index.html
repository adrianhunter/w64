<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>w64</title>
        <base href="/static/linux/">
        <script>
        if (location.search === "") {
            const cfg = location.origin + "/static/linux/alpine-x86_64.cfg";
            history.replaceState(null, "", location.pathname + "?cpu=x86_64&url=" + encodeURIComponent(cfg) + "&mem=256");
        }

        globalThis.esmsInitOptions = {
            // Enable Shim Mode
            shimMode: true, // default false
            // Enable newer modules features
            polyfillEnable: ["all"],
            // Don't retrigger load events on module scripts (DOMContentLoaded, domready, window 'onload')
            noLoadEventRetriggers: true, // default false
            // Secure mode to not support loading modules without integrity
            // (integrity is always verified even when disabled though)
            enforceIntegrity: false, // default false
            // Permit overrides to import maps
            mapOverrides: true, // default false
        };
        </script>

        <script type="importmap-shim">
        {
            "imports": {
                "@wterm/dom": "/node_modules/@wterm/dom/dist/index.js",
                "@wterm/core": "/node_modules/@wterm/core/dist/index.js",
                "@wterm/ghostty": "/node_modules/@wterm/ghostty/dist/index.js"
            }
        }
        </script>

        <script
            async
            src="/static/es-module-shims/dist/es-module-shims.debug.js"
        ></script>

        <link rel="stylesheet" href="/node_modules/@wterm/dom/src/terminal.css">
        <link rel="stylesheet" href="/static/linux/style.css">
    </head>
    <body>
        <div id="term_wrap">
            <div id="term_container"></div>
            <div id="term_bar">
                <label>
                    <img title="Upload files" src="images/upload-icon.png"><input type="file" id="files" multiple onchange="on_update_files(this.files)">
                </label>
                <progress id="net_progress"></progress>
            </div>
        </div>

        <script type="module-shim">
          import "/linux.js";
        </script>
    </body>
</html>
