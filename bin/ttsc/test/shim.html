<!doctype html>
<meta charset="utf-8" />
<title>ttsc via es-module-shims</title>
<pre id="out">running…</pre>
<script>
  globalThis.esmsInitOptions = {
    shimMode: true,
    polyfillEnable: ["all"],
    noLoadEventRetriggers: true,
  };
</script>
<script async src="/static/es-module-shims/dist/es-module-shims.debug.js"></script>
<script type="module-shim">
  import ttsc from "/bin/ttsc.wasm";

  try {
    const src = 'const x: number = 1;\nexport function App(props: { name: string }) { return <div class="a" onClick={() => console.log(props.name)}>Hello {props.name}</div>; }';
    const out = ttsc(src, "index.tsx");
    document.getElementById("out").textContent = "OK\n" + out;
  } catch (e) {
    document.getElementById("out").textContent = "ERR " + (e && e.stack ? e.stack : e);
  }
</script>
